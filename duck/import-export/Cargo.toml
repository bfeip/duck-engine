[package]
name = "duck-engine-import-export"
version = "0.1.0"
edition = "2024"

[features]
assimp = ["dep:russimp"]
usd = ["dep:openusd", "dep:zip"]
cad = ["dep:opencascade", "duck-engine-scene/cad"]

[dependencies]
duck-engine-common = { path = "../common" }
duck-engine-scene = { path = "../scene" }
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
gltf = { version = "1.4", features = ["utils", "KHR_materials_transmission"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
thiserror = "2.0"

# Optional format loaders
russimp = { version = "3", features = ["prebuilt"], optional = true }
openusd = { version = "0.1", optional = true }
zip = { version = "8", optional = true, default-features = false, features = ["deflate"] }
opencascade = { path = "../../third-party/opencascade-rs/crates/opencascade", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "import_export"
harness = false
