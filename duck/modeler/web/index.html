<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modeler</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #202124; }
      #canvas { display: block; width: 100vw; height: 100vh; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center;
        padding: 16px; color: #ddd; font: 14px/1.5 system-ui, sans-serif;
        text-align: center; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="status">Loading the modeler…</div>
    <script>
      const canvas = document.getElementById("canvas");

      // The modeler is driven by mouse and keyboard; touch-only devices get a
      // notice instead of the (large) module download.
      const touchOnly =
        matchMedia("(any-pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches;

      if (touchOnly) {
        canvas.remove();
        document.getElementById("status").textContent =
          "The modeler needs a mouse and keyboard. Open this page on a desktop or laptop computer.";
      } else {
        canvas.addEventListener("contextmenu", (event) => event.preventDefault());

        var Module = {
          canvas,
          onRuntimeInitialized: () => document.getElementById("status").remove(),
        };

        const script = document.createElement("script");
        script.src = "modeler.js";
        document.body.append(script);
      }
    </script>
  </body>
</html>
