[package]
name = "duck-engine-renderer"
version = "0.1.0"
edition = "2024"

[lib]
name = "duck_engine_renderer"
path = "src/lib.rs"

[dependencies]
duck-engine-render-core = { path = "../render-core" }
duck-engine-ibl = { path = "../ibl" }
duck-engine-common = { path = "../common" }
duck-engine-scene = { path = "../scene" }
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
wgpu = "27.0"

[dev-dependencies]
pollster = "0.4"
