[package]
name = "duck-engine-scene"
version = "0.1.0"
edition = "2024"

[features]
serde = ["dep:serde", "duck-engine-common/serde", "bitflags/serde", "uuid/serde"]
cad = ["dep:opencascade"]

[dependencies]
duck-engine-common = { path = "../common" }
opencascade = { path = "../../third-party/opencascade-rs/crates/opencascade", optional = true }
uuid = { version = "1", features = ["v7"] }
anyhow = "1.0"
bitflags = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
bytemuck = { version = "1.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
obj-rs = "0.7"
thiserror = "2.0"

# uuid's `js` feature sources randomness from JS via wasm-bindgen. Emscripten
# has a real `std` (and no wasm-bindgen runtime), so it uses the default path.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten")))'.dependencies]
uuid = { version = "1", features = ["v7", "js"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Matches the version `opencascade` builds its DVec3 API on, for `cad` tests.
glam = "0.24"

[[bench]]
name = "geom_query"
harness = false
