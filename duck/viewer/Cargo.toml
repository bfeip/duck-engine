[package]
name = "duck-engine-viewer"
version = "0.1.0"
edition = "2024"


[lib]
name = "duck_engine_viewer"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"


[[example]]
name = "winit"
path = "examples/winit-basic/main.rs"
required-features = ["winit-support"]

[[example]]
name = "materials"
path = "examples/materials/main.rs"
required-features = ["winit-support"]


[features]
winit-support = ["winit"]
assimp = ["duck-engine-import-export/assimp"]
cad = ["duck-engine-import-export/cad"]
usd = ["duck-engine-import-export/usd"]


# Shared dependencies
[dependencies]
duck-engine-common = { path = "../common" }
duck-engine-renderer = { path = "../renderer" }
duck-engine-scene = { path = "../scene" }
duck-engine-import-export = { path = "../import-export" }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
bitflags = { version = "2.0", features = ["serde"] }
bytemuck = { version = "1.16", features = ["derive"] }
cfg-if = "1"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
pollster = "0.4"
thiserror = "2.0"
web-time = "1"
wesl = "0.3.2"
wgpu = "27.0"
winit = { version = "0.30", features = ["android-native-activity"], optional = true }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

# Web-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement"] }
wgpu = { version = "27.0", features = ["webgl"] }

