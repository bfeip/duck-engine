<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>duck — emscripten basic</title>
    <style>
      body { margin: 0; background: #202124; display: grid; place-items: center; height: 100vh; }
      canvas { border: 1px solid #444; }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>

      // Emscripten's GL layer looks up the canvas here when the EGL surface is

      var Module = { canvas: document.getElementById("canvas") };
    </script>
    <script src="emscripten-basic.js"></script>
  </body>
